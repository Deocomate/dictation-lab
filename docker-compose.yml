services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Application Configuration
      APP_NAME: "${APP_NAME:-Dictation Lab}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://dictation-lab.minhlong03.site}"
      APP_KEY: "${APP_KEY:-base64:x+U9si6CshA3pz3Q4oObxEqCWGJp5+o2wdmBFH9Iebs=}"
      APP_LOCALE: "${APP_LOCALE:-vi}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"

      # Database Configuration (Internal Docker network)
      DB_CONNECTION: mariadb
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-db_dictationlab}"
      DB_USERNAME: "${DB_USERNAME:-admin}"
      DB_PASSWORD: "${DB_PASSWORD:-Admin@123}"

      # Session & Cache
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_ENCRYPT: "${SESSION_ENCRYPT:-false}"
      SESSION_PATH: "${SESSION_PATH:-/}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-log}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"

      # Logging & Mail
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_STACK: "${LOG_STACK:-single}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"

      # Third-party Integrations (Auto-detected by Coolify)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-https://dictation-lab.minhlong03.site/auth/google/callback}"

      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      FACEBOOK_REDIRECT_URI: "${FACEBOOK_REDIRECT_URI:-https://dictation-lab.minhlong03.site/auth/facebook/callback}"

      SEPAY_MERCHANT_ID: "${SEPAY_MERCHANT_ID:-}"
      SEPAY_SECRET_KEY: "${SEPAY_SECRET_KEY:-}"
      SEPAY_ENVIRONMENT: "${SEPAY_ENVIRONMENT:-sandbox}"

      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_API_URL: "${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-google/gemini-flash-1.5}"
      OPENROUTER_SITE_URL: "${OPENROUTER_SITE_URL:-https://dictation-lab.minhlong03.site}"
      OPENROUTER_SITE_NAME: "${OPENROUTER_SITE_NAME:-Dictation Lab}"
    volumes:
      - storage_app_public:/var/www/html/storage/app/public
    # `expose` (not `ports`) — never publish a host port, so the app never
    # collides with other projects on the same Coolify server. Coolify's
    # Traefik proxy reaches this container over the internal network using
    # the FQDN you set in the Coolify UI.
    expose:
      - "80"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-db_dictationlab}"
      MARIADB_USER: "${DB_USERNAME:-admin}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-Admin@123}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-Admin@123}"
    volumes:
      - mariadb_data:/var/lib/mysql
    # Internal only — reachable by `app` over the compose network, never
    # exposed to the host, so it can't clash with another project's DB port.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage_app_public:
  mariadb_data:
